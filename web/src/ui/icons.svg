<!--
  WasteWise icon sprite.

  Hand-picked rather than pulled from a library: twenty glyphs is not worth a dependency,
  and every icon here has to survive being 16px tall inside a dense board row.

  Everything sits on a 24px grid and carries no paint of its own. Stroke, fill and joins
  come from the `.icon` rule in index.css, so they inherit down through `<use>` and an icon
  takes the colour of whatever it sits in — the urgency bands need exactly that, since the
  same clock renders in --warn on the board and in --muted in the legend. That is also why
  the Vite template's sprite was useless here: it hardcoded #08060d fills, which would have
  stayed black in dark mode.

  The two solid glyphs (half, dot) set fill/stroke on their own shapes. An element's own
  presentation attribute beats an inherited value, so those overrides survive cloning.
-->
<svg xmlns="http://www.w3.org/2000/svg">

  <!-- Inventory actions -->
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5" />
  </symbol>
  <symbol id="i-half" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" stroke="none" />
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4 7h16M10 4h4M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" />
    <path d="M10 11v6M14 11v6" />
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M18 6 6 18M6 6l12 12" />
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14" />
  </symbol>

  <!-- Urgency bands. Shape carries the band as much as colour does. -->
  <symbol id="i-warning" viewBox="0 0 24 24">
    <path d="M12 3.6 2.7 19.4a1 1 0 0 0 .9 1.5h16.8a1 1 0 0 0 .9-1.5Z" />
    <path d="M12 9.5v4.2M12 17.3h.01" />
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 6.8V12l3.4 2" />
  </symbol>
  <symbol id="i-dot" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Navigation -->
  <symbol id="i-home" viewBox="0 0 24 24">
    <path d="M3.5 10.6 12 3.4l8.5 7.2" />
    <path d="M5.5 9.3V19a1.5 1.5 0 0 0 1.5 1.5h3.2v-5.4h3.6v5.4H17a1.5 1.5 0 0 0 1.5-1.5V9.3" />
  </symbol>
  <symbol id="i-pot" viewBox="0 0 24 24">
    <path d="M4.6 9.2h14.8v5.9a4.4 4.4 0 0 1-4.4 4.4H9a4.4 4.4 0 0 1-4.4-4.4Z" />
    <path d="M4.6 11.4H2.4M19.4 11.4h2.2" />
    <path d="M9.4 6.4c0-1.3 1-1.3 1-2.6M14 6.4c0-1.3 1-1.3 1-2.6" />
  </symbol>
  <symbol id="i-scan" viewBox="0 0 24 24">
    <path d="M4 8.4V6.2A2.2 2.2 0 0 1 6.2 4h2.2M15.6 4h2.2A2.2 2.2 0 0 1 20 6.2v2.2M20 15.6v2.2a2.2 2.2 0 0 1-2.2 2.2h-2.2M8.4 20H6.2A2.2 2.2 0 0 1 4 17.8v-2.2" />
    <path d="M8.6 9v6M12 9v6M15.4 9v6" />
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24">
    <path d="M3.6 20.4h16.8" />
    <path d="M6.8 20.4v-6.2M12 20.4V6.6M17.2 20.4v-9.1" />
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <path d="M5 21v-6.4M5 10.4V3M12 21v-8.6M12 8.2V3M19 21v-4.4M19 12.4V3" />
    <path d="M2.6 14.6h4.8M9.6 8.2h4.8M16.6 16.6h4.8" />
  </symbol>
  <symbol id="i-logout" viewBox="0 0 24 24">
    <path d="M9.6 20.4H6a2 2 0 0 1-2-2V5.6a2 2 0 0 1 2-2h3.6" />
    <path d="m15.8 16.6 4.6-4.6-4.6-4.6M20.4 12H9.4" />
  </symbol>

  <!-- Disclosure + direction -->
  <symbol id="i-chevron-right" viewBox="0 0 24 24">
    <path d="m9.5 5.5 6.5 6.5-6.5 6.5" />
  </symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24">
    <path d="m5.5 9.5 6.5 6.5 6.5-6.5" />
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24">
    <path d="m14.5 5.5-6.5 6.5 6.5 6.5" />
  </symbol>

  <!-- Trend + range. Unused today; the dashboard is the reason they exist. -->
  <symbol id="i-trend-up" viewBox="0 0 24 24">
    <path d="m3.6 17.4 5.6-5.6 3.6 3.6 7.6-7.6" />
    <path d="M15.4 7.8h5v5" />
  </symbol>
  <symbol id="i-trend-down" viewBox="0 0 24 24">
    <path d="m3.6 6.6 5.6 5.6 3.6-3.6 7.6 7.6" />
    <path d="M15.4 16.2h5v-5" />
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24">
    <rect x="3.6" y="5.2" width="16.8" height="15.2" rx="2" />
    <path d="M8.4 3v4.4M15.6 3v4.4M3.6 10.4h16.8" />
  </symbol>
</svg>
