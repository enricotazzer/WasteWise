<!doctype html>
<!-- The misya.info shape: one clean `@type: Recipe` document, HowToStep instructions,
     no totalTime (prepTime + cookTime instead). -->
<html lang="it">
<head>
<title>Pasta alla Norma</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Pasta alla Norma",
  "recipeYield": "4 persone",
  "prepTime": "PT20M",
  "cookTime": "PT25M",
  "recipeIngredient": [
    "320 g di pasta",
    "2 melanzane",
    "400 g di passata di pomodoro",
    "100 g di ricotta salata",
    "basilico q.b."
  ],
  "recipeInstructions": [
    {"@type": "HowToStep", "text": "Taglia le melanzane a cubetti e friggile."},
    {"@type": "HowToStep", "text": "Prepara il sugo con la passata e il basilico."},
    {"@type": "HowToStep", "text": "Condisci la pasta e completa con la ricotta salata."}
  ]
}
</script>
</head>
<body><h1>Pasta alla Norma</h1></body>
</html>
