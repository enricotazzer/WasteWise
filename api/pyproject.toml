[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit: flat layout with app/, tests/ and alembic/ side by side would otherwise
# trip setuptools' multiple-top-level-packages auto-discovery error.
packages = ["app"]

[project]
name = "wastewise-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.10",  # [email] -> email-validator, required by EmailStr
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.17",
    # <4: the 4.x API is a rewrite (no BlockingScheduler), and the Phase 4 scheduler is
    # written against 3.x.
    "apscheduler>=3.10,<4",
    "pgvector>=0.3.6",
    # Runtime, not just test: Open Food Facts and both LLM providers are plain HTTP calls,
    # which is cheaper than three vendor SDKs for the surface actually used.
    "httpx>=0.28",
    # --- Risk model (phase 3) ---
    # CPU-only, per the no-paid-inference / no-fine-tuning constraint. lifelines brings the
    # Cox PH fit and the Kaplan-Meier cold-start fallback; sklearn is the GBM it's compared
    # against. Both depend on pandas/numpy, which are pinned here because the feature frame
    # and the eval notebook use them directly rather than only through those two.
    "lifelines>=0.30",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "numpy>=2.1",
    # --- Recipes (phase 4) ---
    # ONNX rather than sentence-transformers, which is what the brief names. Same model
    # (all-MiniLM-L6-v2) and the same 384-dim output the `recipes.embedding` column is
    # already sized for, but fastembed runs it on onnxruntime (~50 MB) where
    # sentence-transformers would pull torch (~2 GB in this image) to do identical work.
    # The brief's intent was "CPU embeddings, offline, no API cost"; this satisfies it and
    # keeps `make setup` from becoming a multi-gigabyte download.
    "fastembed>=0.5",
    # JSON-LD extraction: recipe sites embed schema.org/Recipe in <script> tags, so the
    # parser needs to find those tags, not to understand the surrounding HTML.
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",  # httpx mocking — no network in the test suite
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The seed files are data tables, reviewed by a human as tables. The formatter explodes
# them one-field-per-line (recipes.py went from 277 to 900+ lines), which destroys the only
# property that makes them reviewable. Excluded from the formatter; E501 waived below.
# `**/._*`: macOS writes AppleDouble sidecars (binary, named like the source file) on the
# exFAT volume this repo lives on, and ruff would otherwise try to parse them as Python.
extend-exclude = ["app/seeds/data.py", "app/seeds/recipes.py", "**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/seeds/data.py" = ["E501"]
"app/seeds/recipes.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
