services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wastewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wastewise}
      POSTGRES_DB: ${POSTGRES_DB:-wastewise}
      TZ: ${TZ:-Europe/Rome}
    ports:
      # 5433 on the host to avoid clashing with a local Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wastewise} -d ${POSTGRES_DB:-wastewise}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wastewise}:${POSTGRES_PASSWORD:-wastewise}@db:5432/${POSTGRES_DB:-wastewise}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/srv/api
      - ./data:/srv/data
      # The eval notebook runs against this container, because that is where `app` and the
      # database credentials already are. Mounted rather than copied so an executed notebook
      # writes its outputs back to the repo.
      - ./notebooks:/srv/notebooks
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
