name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint + tests
    runs-on: ubuntu-24.04
    services:
      # The same image docker-compose.yml runs: the suite needs real JSONB and pgvector,
      # and creates/drops its own `wastewise_test` database (tests/conftest.py).
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wastewise
          POSTGRES_PASSWORD: wastewise
          POSTGRES_DB: wastewise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wastewise -d wastewise"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://wastewise:wastewise@localhost:5432/wastewise
      # The api container runs in Europe/Rome; date-boundary logic should see the same clock.
      TZ: Europe/Rome
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install the pinned environment
        # --no-deps + pip check: every transitive dependency must already be pinned, so a
        # gap in requirements.txt fails here instead of being silently resolved from PyPI.
        run: |
          pip install --no-deps -r requirements-dev.txt
          pip install --no-deps -e .
          pip check
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: pytest -q

  web:
    name: Web · lint + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
